# Use in the HTTPS server for the separately controlled wildcard application
# domain. Configure its DNS and certificate outside the LinkSense console domain.
# This routes through the existing LinkSense gateway port and API location.
location / {
    client_max_body_size 21m;
    access_log off;
    proxy_intercept_errors off;
    proxy_pass http://127.0.0.1:8080/api/v1/public-app-gateway/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 40s;
}
