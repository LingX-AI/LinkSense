# Vite uses WebSocket upgrades for HMR. Ordinary HTTP/2 API/SSE streams do not
# forward hop-by-hop Connection headers to the HTTP/1.1 upstream.
map $http_upgrade $development_connection {
    default upgrade;
    ''      '';
}

upstream development_web {
    zone development_web 64k;
    # Docker may replace Web with a new IP after a dependency rebuild.
    resolver 127.0.0.11 valid=1s ipv6=off;
    server web:18173 resolve;
    keepalive 32;
}

# Container-only health endpoint; port 80 is not published to the host.
server {
    listen 80;
    access_log off;
    location = /health/live {
        return 200 'ok';
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /run/linksense-dev-tls/cert.pem;
    ssl_certificate_key /run/linksense-dev-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The API retains its own upload limits. Avoid Nginx's default 1 MiB cap.
    client_max_body_size 0;
    access_log off;

    location / {
        proxy_pass http://development_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $development_connection;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
