allow_managed_hooks_only = true

# Codex also syncs its curated Git catalog when remote_plugin is disabled.
# Both personal and application workers mount their authorized local market here.
[marketplaces]
restrict_to_allowed_sources = true

[marketplaces.allowed_sources.linksense]
source = "local"
path = "/home/linksense"

[hooks]
managed_dir = "/opt/linksense/runtime/node"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "/usr/local/bin/node /opt/linksense/runtime/node/plan-stop-hook.mjs"
timeout = 15
statusMessage = "Validating LinkSense Plan Mode output"
