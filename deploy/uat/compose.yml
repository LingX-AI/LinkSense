services:
  migrate:
    build:
      context: ${LINKSENSE_SOURCE_ROOT}
      dockerfile: deploy/docker/Dockerfile.api
      target: migration
  worker-image:
    build:
      context: ${LINKSENSE_SOURCE_ROOT}
      dockerfile: deploy/docker/Dockerfile.runner
      target: worker
      args:
        WORKER_IMAGE_FINGERPRINT: ${LINKSENSE_WORKER_IMAGE_REVISION}
  runner:
    build:
      context: ${LINKSENSE_SOURCE_ROOT}
      dockerfile: deploy/docker/Dockerfile.runner
      target: controller
  api:
    build:
      context: ${LINKSENSE_SOURCE_ROOT}
      dockerfile: deploy/docker/Dockerfile.api
      target: runtime
  web:
    build:
      context: ${LINKSENSE_SOURCE_ROOT}
      dockerfile: deploy/docker/Dockerfile.web
      target: runtime
  gateway:
    volumes:
      - ${LINKSENSE_SOURCE_ROOT}/deploy/release/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
