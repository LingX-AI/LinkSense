services:
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?release manifest did not provide ELASTICSEARCH_IMAGE}
    restart: unless-stopped
    mem_limit: ${LINKSENSE_ELASTICSEARCH_MEMORY_MB:-0}m
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTICSEARCH_ROOT_USERNAME: elastic
      ELASTIC_PASSWORD: ${ELASTICSEARCH_ROOT_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - knowledge-internal
    healthcheck:
      test: ["CMD-SHELL", "credentials=$$ELASTICSEARCH_ROOT_USERNAME:$$ELASTIC_PASSWORD; curl -fsS -u \"$$credentials\" http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 40s

  elasticsearch-init:
    image: ${ELASTICSEARCH_IMAGE:?release manifest did not provide ELASTICSEARCH_IMAGE}
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_ROOT_USERNAME: elastic
      ELASTICSEARCH_ROOT_PASSWORD: ${ELASTICSEARCH_ROOT_PASSWORD}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
    entrypoint: ["/bin/bash", "-ec"]
    networks:
      - knowledge-internal
    command:
      - |
        root_credentials="$$ELASTICSEARCH_ROOT_USERNAME:$$ELASTICSEARCH_ROOT_PASSWORD"
        curl -fsS -u "$$root_credentials" \
          -H 'Content-Type: application/json' \
          -X PUT http://elasticsearch:9200/_security/role/linksense \
          -d '{"cluster":["monitor"],"indices":[{"names":["linksense-knowledge*"],"privileges":["all"]}]}' >/dev/null
        curl -fsS -u "$$root_credentials" \
          -H 'Content-Type: application/json' \
          -X POST "http://elasticsearch:9200/_security/user/$$ELASTICSEARCH_USERNAME" \
          -d "{\"password\":\"$$ELASTICSEARCH_PASSWORD\",\"roles\":[\"linksense\"]}" >/dev/null

  docling-api:
    image: ${DOCLING_IMAGE:?release manifest did not provide DOCLING_IMAGE}
    restart: unless-stopped
    user: "1001:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: ${LINKSENSE_DOCLING_API_CPUS:-1}
    pids_limit: 256
    tmpfs:
      - /tmp:size=2g,mode=1777
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY}
      DOCLING_SERVE_ENG_KIND: rq
      DOCLING_SERVE_ENG_RQ_REDIS_URL: ${DOCLING_REDIS_URL}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_LOG_FORMAT: text
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - knowledge-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,urllib.request; r=urllib.request.Request(\"http://127.0.0.1:5001/ready\",headers={\"X-Api-Key\":os.environ[\"DOCLING_SERVE_API_KEY\"]}); urllib.request.urlopen(r,timeout=5).read()'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  docling-worker:
    image: ${DOCLING_IMAGE:?release manifest did not provide DOCLING_IMAGE}
    restart: unless-stopped
    command: ["docling-serve", "rq-worker"]
    user: "1001:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: ${LINKSENSE_DOCLING_WORKER_CPUS:-4}
    pids_limit: 512
    tmpfs:
      - /tmp:size=4g,mode=1777
    environment:
      DOCLING_SERVE_ENG_KIND: rq
      DOCLING_SERVE_ENG_RQ_REDIS_URL: ${DOCLING_REDIS_URL}
      DOCLING_SERVE_LOG_FORMAT: text
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - tokenizer-data:${LINKSENSE_TOKENIZER_MOUNT_PATH}:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - knowledge-internal

  redis:
    networks:
      - default
      - knowledge-internal

  api:
    labels:
      org.linksense.edition: full
    environment:
      LINKSENSE_KB_HYBRID_TOKENIZER: ${LINKSENSE_KB_HYBRID_TOKENIZER}
      LINKSENSE_KB_PARSING_CONCURRENCY: ${LINKSENSE_KB_PARSING_CONCURRENCY:-4}
      LINKSENSE_KB_CHUNKING_CONCURRENCY: ${LINKSENSE_KB_CHUNKING_CONCURRENCY:-8}
      LINKSENSE_KB_PARENTING_CONCURRENCY: ${LINKSENSE_KB_PARENTING_CONCURRENCY:-8}
      LINKSENSE_KB_EMBEDDING_CONCURRENCY: ${LINKSENSE_KB_EMBEDDING_CONCURRENCY:-8}
      LINKSENSE_KB_INDEXING_CONCURRENCY: ${LINKSENSE_KB_INDEXING_CONCURRENCY:-8}
      LINKSENSE_KB_ACTIVATION_CONCURRENCY: ${LINKSENSE_KB_ACTIVATION_CONCURRENCY:-16}
      LINKSENSE_KB_HYBRID_MAX_TOKENS: "768"
      LINKSENSE_KB_PARENT_MAX_TOKENS: "3000"
      LINKSENSE_KB_EMBEDDING_DIMENSIONS: "2560"
      LINKSENSE_KB_EMBEDDING_MAX_INPUT_TOKENS: "32768"
      LINKSENSE_KB_ELASTICSEARCH_URL: http://elasticsearch:9200
      LINKSENSE_KB_ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      LINKSENSE_KB_ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      LINKSENSE_KB_ELASTICSEARCH_INDEX: linksense-knowledge
      DOCLING_SERVE_URL: http://docling-api:5001
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY}
      DOCLING_SERVE_TENANT_ID: linksense
      LINKSENSE_DOCLING_DOCUMENT_TIMEOUT_SECONDS: "1800"
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
      docling-api:
        condition: service_healthy
    networks:
      - default
      - knowledge-internal

volumes:
  elasticsearch-data:
    external: true
    name: ${LINKSENSE_ELASTICSEARCH_VOLUME}
  tokenizer-data:
    external: true
    name: ${LINKSENSE_TOKENIZER_VOLUME}

networks:
  knowledge-internal:
    name: ${LINKSENSE_KNOWLEDGE_NETWORK}
    internal: true
