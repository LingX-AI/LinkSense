map $uri $linksense_cache_control {
  default "no-store";
  ~^/help/(?:en-US/)?assets/ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  access_log off;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/linksense/help-location.conf;
  location / { return 404; }
}
