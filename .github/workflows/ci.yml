name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare an isolated build and artifact fixture
        run: |
          mkdir build-context
          printf 'FROM scratch\nLABEL org.opencontainers.image.title="linksense-action-check"\n' > build-context/Dockerfile
          printf 'LinkSense artifact compatibility\n' > build-context/result.txt

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build without publishing an image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: build-context
          push: false
          outputs: type=oci,dest=smoke-image.tar

      - name: Verify the build digest contract
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: '[[ "$BUILD_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-actions-smoke
          path: build-context/result.txt
          if-no-files-found: error
          retention-days: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-actions-smoke
          path: downloaded

      - name: Verify archive extraction and unchanged artifact bytes
        run: cmp build-context/result.txt downloaded/result.txt

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Redis test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build

      - name: Audit production dependencies
        run: pnpm audit --registry=https://registry.npmjs.org --prod --audit-level high

      - name: Validate types and lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm typecheck
          pnpm lint

      - name: Run unit and deployment tests
        run: |
          pnpm --filter @linksense/shared build
          pnpm test:deployment
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_patch_elasticsearch_jars.py
          pnpm --filter @linksense/shared test
          pnpm --filter @linksense/api test
          pnpm --filter @linksense/runner test
          pnpm --filter @linksense/web test:unit
          pnpm --filter @linksense/docs test

      - name: Verify interactive upload database migrations
        run: pnpm test:interactive-files:postgres

      - name: Verify application development instruction migrations
        run: pnpm test:development-instructions:postgres

      - name: Run privileged runner filesystem test
        run: |
          sudo env "PATH=$PATH" pnpm --filter @linksense/runner exec vitest run test/workspace-manager.test.ts

      - name: Build production artifacts
        run: pnpm build
