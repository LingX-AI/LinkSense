name: Issue intake

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acknowledge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Add triage status and acknowledge the report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issueNumber = context.issue.number
            const marker = "<!-- linksense-issue-intake -->"

            const labels = context.payload.issue.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            )
            if (!labels.includes("status:triage")) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["status:triage"],
              })
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 },
            )
            if (comments.some((comment) => comment.body?.includes(marker))) {
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `${marker}
Thank you for opening this issue. A maintainer will review the report. If more information is needed, we will add the \`needs-info\` label and ask focused follow-up questions. Please do not post secrets, tokens, personal data, or private deployment details.

感谢提交 Issue。维护者会审阅报告；如果还需要信息，我们会添加 \`needs-info\` 标签并提出明确的问题。请勿在 Issue 中发布密钥、Token、个人数据或私有部署信息。`,
            })
