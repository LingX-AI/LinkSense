name: Installer lifecycle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published runtime version (empty selects latest stable)
        required: false
        type: string
      centos_vm:
        description: Also run the experimental CentOS Stream 9 VM
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Freeze published runtime and previous release, then bundle source installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir published-assets
          node scripts/prepare-installer-test-assets.mjs published-assets release-assets
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name] | .[]' | sort -Vr | awk -v current="$VERSION" '$0 == current { found=1; next } found { print; exit }')
          [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" --dir previous-release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-lifecycle-assets
          path: |
            release-assets/
            previous-release-assets/
          if-no-files-found: error
          retention-days: 3

  ubuntu:
    needs: assets
    name: Full lifecycle (Ubuntu 22.04, ${{ matrix.edition }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [core, full]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer-lifecycle-assets
      - name: Verify install, repair and persisted-data upgrade on a disposable host
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo sysctl -w vm.max_map_count=262144
          sudo env "PATH=$PATH" "GITHUB_SHA=$GITHUB_SHA" "ImageOS=$ImageOS" "ImageVersion=$ImageVersion" \
            node scripts/release-installation-smoke.mjs release-assets "$EDITION" installation-reports previous-release-assets
      - name: Save installation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-ubuntu-22.04-${{ matrix.edition }}
          path: installation-reports/
          if-no-files-found: error
          retention-days: 14

  centos:
    if: inputs.centos_vm
    needs: assets
    name: Full lifecycle (CentOS Stream 9 VM, ${{ matrix.edition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [core, full]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer-lifecycle-assets
      - name: Install VM tools and free unused SDK disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Run the real CentOS guest with its own kernel and Docker daemon
        env:
          EDITION: ${{ matrix.edition }}
        run: bash scripts/installer-centos-vm.sh "$EDITION" installation-reports
      - name: Save VM and installation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-centos-stream-9-${{ matrix.edition }}
          path: installation-reports/
          if-no-files-found: error
          retention-days: 14
