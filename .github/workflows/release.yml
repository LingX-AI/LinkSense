name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linksense-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      candidate_tag: ${{ steps.release.outputs.candidate_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      license: ${{ steps.release.outputs.license }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify release authorization and identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR: ${{ vars.LINKSENSE_RELEASE_ACTOR }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main || {
            echo "Releases must be dispatched from main." >&2
            exit 1
          }
          test -n "$RELEASE_ACTOR" || {
            echo "Repository variable LINKSENSE_RELEASE_ACTOR is required." >&2
            exit 1
          }
          test "$GITHUB_ACTOR" = "$RELEASE_ACTOR" || {
            echo "Only LINKSENSE_RELEASE_ACTOR may dispatch a release." >&2
            exit 1
          }
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          case "$visibility" in
            private|public) ;;
            *) echo "Unsupported repository visibility: $visibility" >&2; exit 1 ;;
          esac
          require_successful_workflow() {
            workflow_file=$1
            workflow_name=$2
            workflow_run=$(
              WORKFLOW_EVENTS="$3" TARGET_SHA="$GITHUB_SHA" gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs" \
                -f branch=main \
                -f head_sha="$GITHUB_SHA" \
                -f status=completed \
                -f per_page=100 \
                --jq 'first(.workflow_runs[] | .event as $event | select(.head_sha == env.TARGET_SHA and .head_branch == "main" and .conclusion == "success" and (env.WORKFLOW_EVENTS | split(",") | index($event)))) | select(. != null) | [.id, .html_url] | @tsv'
            )
            test -n "$workflow_run" || {
              echo "$workflow_name must pass on main at $GITHUB_SHA before releasing." >&2
              echo "Wait for the existing $workflow_name workflow to succeed, then dispatch the release again." >&2
              exit 1
            }
            printf '%s verified: %s\n' "$workflow_name" "$workflow_run"
            verified_workflow_run_id=${workflow_run%%$'\t'*}
          }
          require_successful_workflow ci.yml CI push
          require_successful_workflow security.yml Security push,public,workflow_dispatch,schedule
          if [ "$visibility" = public ]; then
            codeql_job=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$verified_workflow_run_id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "codeql" and .conclusion == "success") | .id')
            test -n "$codeql_job" || {
              echo "CodeQL must pass on main at $GITHUB_SHA before a public release." >&2
              echo "Run the Security workflow on main after making the repository public, then retry." >&2
              exit 1
            }
          fi
          package_version=$(node -p 'require("./package.json").version')
          package_license=$(node -p 'require("./package.json").license')
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "package.json version must be plain SemVer." >&2
            exit 1
          }
          test "$package_license" = CPAL-1.0 || {
            echo "The release license must be CPAL-1.0." >&2
            exit 1
          }
          release_version="v${package_version}"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git rev-parse --verify --quiet "refs/tags/$release_version"; then
            echo "Git tag $release_version already exists." >&2
            exit 1
          fi
          if gh release view "$release_version" >/dev/null 2>&1; then
            echo "GitHub Release $release_version already exists." >&2
            exit 1
          fi
          {
            echo "release_version=$release_version"
            echo "candidate_tag=$candidate_tag"
            echo "source_sha=$GITHUB_SHA"
            echo "license=$package_license"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Validate and freeze release inputs before building images
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE_WORKFLOW_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh scripts/prepare-release-inputs.sh release-inputs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-inputs
          path: release-inputs/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  images:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      # Preserve completed sibling builds when one architecture or image fails.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
            target: runtime
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: api
            dockerfile: Dockerfile.api
            target: runtime
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: web
            dockerfile: Dockerfile.web
            target: runtime
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: web
            dockerfile: Dockerfile.web
            target: runtime
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: migrate
            dockerfile: Dockerfile.api
            target: migration
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: migrate
            dockerfile: Dockerfile.api
            target: migration
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: runner
            dockerfile: Dockerfile.runner
            target: controller
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: runner
            dockerfile: Dockerfile.runner
            target: controller
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }} candidate
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/lingx-ai/linksense-${{ matrix.name }}:${{ needs.prepare.outputs.candidate_tag }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
            org.opencontainers.image.licenses=${{ needs.prepare.outputs.license }}
          provenance: mode=min
          sbom: true
          # The migration image retains the shared dependency stage that the
          # API runtime's minimal cache does not include.
          cache-from: |
            type=gha,scope=${{ matrix.name }}-${{ matrix.architecture }}
            ${{ matrix.name == 'api' && format('type=gha,scope=migrate-{0}', matrix.architecture) || '' }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}-${{ matrix.architecture }},timeout=2m,ignore-error=true
      - name: Smoke-test ${{ matrix.name }} candidate
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/lingx-ai/linksense-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
          docker pull --platform "${{ matrix.platform }}" "$image"
          case "${{ matrix.name }}" in
            api) docker run --rm --entrypoint node "$image" --version ;;
            web) docker run --rm --entrypoint nginx "$image" -t ;;
            migrate) docker run --rm --entrypoint pnpm "$image" --version ;;
            runner) docker run --rm --entrypoint node "$image" --version ;;
          esac
      - name: Record immutable ${{ matrix.platform }} candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir image-reference
          printf '%s\n' \
            "ghcr.io/lingx-ai/linksense-${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            > "image-reference/${{ matrix.name }}-${{ matrix.architecture }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-platform-${{ matrix.name }}-${{ matrix.architecture }}
          path: image-reference/${{ matrix.name }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  worker-image:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # Preserve completed sibling builds when one architecture or image fails.
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish worker candidate
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile.runner
          target: worker
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/lingx-ai/linksense-worker:${{ needs.prepare.outputs.candidate_tag }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
            org.opencontainers.image.licenses=${{ needs.prepare.outputs.license }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=worker-${{ matrix.architecture }}
          cache-to: type=gha,mode=min,scope=worker-${{ matrix.architecture }},timeout=2m,ignore-error=true
      - name: Smoke-test worker candidate
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/lingx-ai/linksense-worker@${{ steps.build.outputs.digest }}"
          docker pull --platform "${{ matrix.platform }}" "$image"
          docker run --rm --user 1001:1000 --entrypoint node "$image" --input-type=module \
            --eval "import { assertCodexRuntimeVersion } from './dist/codex/runtime-version.js'; await assertCodexRuntimeVersion({ command: 'codex' })"
      - name: Record immutable ${{ matrix.platform }} worker candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir image-reference
          printf '%s\n' \
            "ghcr.io/lingx-ai/linksense-worker@${{ steps.build.outputs.digest }}" \
            > "image-reference/worker-${{ matrix.architecture }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-platform-worker-${{ matrix.architecture }}
          path: image-reference/worker-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  image-indexes:
    needs: [prepare, images, worker-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-platform-*
          path: image-platform-references
          merge-multiple: true
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge tested architecture images into OCI indexes
        shell: bash
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          mkdir image-references
          for name in api web migrate runner worker; do
            amd64_reference=$(cat "image-platform-references/$name-amd64")
            arm64_reference=$(cat "image-platform-references/$name-arm64")
            candidate_reference="ghcr.io/lingx-ai/linksense-${name}:${CANDIDATE_TAG}"
            docker buildx imagetools create \
              --tag "$candidate_reference" \
              "$amd64_reference" \
              "$arm64_reference"
            scripts/resolve-release-image.sh \
              "$candidate_reference" linux/amd64 linux/arm64 \
              > "image-references/$name"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-indexes
          path: image-references/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  assets:
    needs: [prepare, image-indexes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-indexes
          path: image-references
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inputs
          path: release-inputs
      - name: Assemble release assets from the verified inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_GIT_COMMIT: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_WORKFLOW_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          (cd release-inputs && sha256sum -c SHA256SUMS)
          test "$(sed -n 's/^RELEASE_VERSION=//p' release-inputs/identity.env)" = "$RELEASE_VERSION"
          test "$(sed -n 's/^SOURCE_SHA=//p' release-inputs/identity.env)" = "$RELEASE_GIT_COMMIT"
          test "$(sed -n 's/^RELEASE_WORKFLOW_ID=//p' release-inputs/identity.env)" = "$RELEASE_WORKFLOW_ID"
          export RELEASE_BUILD_TIME="$(sed -n 's/^RELEASE_BUILD_TIME=//p' release-inputs/identity.env)"
          while IFS='=' read -r key value; do
            export "$key=$value"
          done < release-inputs/upstream-images.env
          for name in api web migrate runner worker; do
            key=$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')
            export "IMAGE_LINKSENSE_${key}=$(cat "image-references/$name")"
          done
          cp -R release-inputs/release-assets release-assets
          node scripts/generate-release-manifest.mjs \
            release-assets/release-manifest.env release-inputs/tokenizer release-assets
          (
            cd release-assets
            sha256sum release-manifest.env > release-manifest.env.sha256
            sha256sum * > SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  release:
    needs: [prepare, image-indexes, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-indexes
          path: image-references
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: release-assets
      - name: Verify anonymous access to every LinkSense image candidate
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          for name in api web migrate runner worker; do
            reference=$(cat "image-references/$name")
            docker buildx imagetools inspect "$reference" >/dev/null || {
              echo "Make GHCR package linksense-$name public, then rerun this failed job." >&2
              exit 1
            }
          done
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested image digests to the release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          for name in api web migrate runner worker; do
            tested_reference=$(cat "image-references/$name")
            tested_digest=${tested_reference##*@}
            release_reference="ghcr.io/lingx-ai/linksense-${name}:${RELEASE_VERSION}"
            if current=$(scripts/resolve-release-image.sh "$release_reference" linux/amd64 linux/arm64 2>/dev/null); then
              test "${current##*@}" = "$tested_digest" || {
                echo "$release_reference already points to another digest." >&2
                exit 1
              }
            else
              docker buildx imagetools create \
                --tag "$release_reference" "$tested_reference"
              current=$(scripts/resolve-release-image.sh "$release_reference" linux/amd64 linux/arm64)
              test "${current##*@}" = "$tested_digest"
            fi
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify all draft assets before publishing the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_WORKFLOW_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/publish-release.mjs release-assets
      - name: Summarize the release boundary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          {
            echo "## LinkSense $RELEASE_VERSION published"
            echo
            echo "- GitHub Release access follows the repository's current visibility."
            echo "- Five GHCR images are public and anonymously pullable."
            echo "- Release assets have been downloaded and verified before publication."
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
