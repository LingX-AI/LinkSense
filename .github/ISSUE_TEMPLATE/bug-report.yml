name: Bug report / 缺陷报告
description: Report a reproducible LinkSense problem / 报告可复现的 LinkSense 问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先移除日志和截图中的 token、密钥、用户内容、内部地址等敏感信息。安全漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: LinkSense version / 版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition / 版本类型
      options:
        - Core
        - Full
        - Source development / 源码开发
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem / 问题描述
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, CPU architecture, Docker Engine and Docker Compose versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / 脱敏日志
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查项
      options:
        - label: I removed secrets and personal data from this report. / 我已移除敏感信息和个人数据。
          required: true
        - label: This is not a security vulnerability. / 这不是安全漏洞。
          required: true
